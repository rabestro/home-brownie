services:
  home-brownie:
    image: ghcr.io/rabestro/home-brownie:latest
    container_name: home-brownie
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN
      - GEMINI_API_KEY
      - GEMINI_MODEL
      - PAPERLESS_URL
      - HOME_ASSISTANT_URL
      - FAMILY_USERS
