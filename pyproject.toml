[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "home-brownie"
version = "0.3.1"
description = "🤎 Autonomous AI-powered Telegram household spirit & homelab assistant for Paperless-ngx, Home Assistant, and GitHub Wiki."
readme = "README.md"
requires-python = ">=3.14"
license = { text = "AGPL-3.0-or-later" }
authors = [
  { name = "Jegors Čemisovs", email = "jegors.cemisovs@gmail.com" },
]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "pyTelegramBotAPI>=4.20.0",
  "google-antigravity>=0.1.12",
  "httpx>=0.28.0",
  "python-dotenv>=1.0",
  "pydantic>=2",
]

[project.scripts]
home-brownie = "home_brownie.__main__:main"

[project.urls]
Homepage = "https://github.com/rabestro/home-brownie"
Repository = "https://github.com/rabestro/home-brownie"
Issues = "https://github.com/rabestro/home-brownie/issues"
Changelog = "https://github.com/rabestro/home-brownie/releases"

[dependency-groups]
dev = [
  "ruff>=0.16.3",
  "mypy>=1.14.0",
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "pytest-asyncio>=0.24.0",
  "respx>=0.21.0",
  "pre-commit>=4.6.2",
]
docs = [
  "mkdocs>=1.6.0",
  "mkdocs-material>=9.5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/home_brownie"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 99

[tool.ruff.lint]
select = [
  "S",   # flake8-bandit
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "DTZ", # flake8-datetimez
  "PT",  # flake8-pytest-style
  "PL",  # pylint (complexity, magic values, common mistakes)
  "RUF", # ruff-specific (incl. RUF100 unused-noqa)
  "SIM", # flake8-simplify
  "N",   # pep8-naming
  "A",   # flake8-builtins (builtin shadowing)
  "RET", # flake8-return
  "D",   # pydocstyle (docstrings; google convention below)
]
ignore = [
  "S101", # Use of assert detected (needed for testing)
  "D107", # Missing docstring in __init__ (constructor args belong in the class docstring)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "D1", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.14"
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_untyped_calls = false
